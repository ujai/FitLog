name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # The build evaluates the auth module, so it needs plausible values.
      # None of these are real secrets; nothing here can sign in anywhere.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-only-placeholder-secret
      APP_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
      ALLOWED_EMAILS: ci@example.com
      APP_TIMEZONE: Asia/Kuala_Lumpur
      NEXT_PUBLIC_APP_TIMEZONE: Asia/Kuala_Lumpur
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm verify
